            effect: "Alone, she admits what she could not say in front of anyone: the crown has not made her happy. The short, blunt words make the line sound like a bargain gone wrong. In Act 1 she imagined ‘the golden round’; now she says that getting it was not worth the cost.",
            ask: "Why does Shakespeare let us hear this when she is alone?", tags: ["ambition", "language", "lady", "peel"] },
          { id: "a3n22-4", from: 8, to: 9, title: "Safer to be the victim",
            meaning: "She says it is safer to be the person you have destroyed than to live in ‘doubtful joy’ (happiness you cannot trust) after destroying them.",
            effect: "She envies Duncan. ‘Destroy’ and ‘destruction’ repeat, so the crime seems stuck in the line. Notice that she says ‘we’: she shares the guilt. Compare Act 2 Scene 2: ‘A little water clears us of this deed.’ She no longer believes it. In Act 5 her guilt will break out when she sleepwalks.",
            ask: "How is this different from the Lady Macbeth who said ‘A little water clears us of this deed’?", tags: ["ambition", "guilt", "lady", "ahead", "peel"] },
          { id: "a3n22-5", from: 10, to: 14, title: "Telling him what she cannot tell herself",
            meaning: "She asks why he keeps alone with ‘sorriest fancies’ (miserable thoughts), and says that things that cannot be mended should be forgotten: ‘What’s done is done.’",
            effect: "Moments after her own speech, she gives Macbeth the opposite advice to what she has just admitted she feels. The audience knows she is not as calm as she sounds. That gap between the private woman and the public voice is appearance against reality. Listen for ‘What’s done cannot be undone’ in Act 5.",
            ask: "Does Lady Macbeth believe her own advice? Use her first four lines to decide.", tags: ["appearance", "irony", "lady", "ahead", "peel"] },
          { id: "a3n22-6", from: 15, to: 17, title: "The snake is only scorched",
            meaning: "Macbeth says they have scorched (wounded) the snake without killing it, so it will heal and bite again with its ‘former tooth’.",
            effect: "In Act 1 she told him to ‘be the serpent under ’t’. Now the snake is the danger. Macbeth cannot rest, because he sees threats everywhere. He is no longer tormented only by what he has done; he is tormented by what might be done to him.",
            ask: "Who was the serpent in Act 1 Scene 5? Who is it now?", tags: ["ambition", "language", "appearance", "peel"] },
          { id: "a3n22-7", from: 18, to: 29, title: "Better to be dead",
            meaning: "Macbeth would rather the whole universe fell apart than live in fear with terrible dreams every night. He says it is better to be with the dead whom they sent ‘to peace’, and that Duncan, after ‘life’s fitful fever’, ‘sleeps well’.",
            effect: "He envies Duncan in almost the same way Lady Macbeth did alone. Neither knows the other thinks it, because each hides it. The audience, not the couple, hears both: dramatic irony. His ambition has won him a throne and lost him peace and sleep. Remember ‘Macbeth shall sleep no more’ from Act 2.",
            ask: "What has Macbeth lost: peace, sleep, or both? Find a word that proves it.", tags: ["ambition", "guilt", "irony", "language", "peel"] },
          { id: "a3n22-8", from: 30, to: 32, title: "“Sleek o’er your rugged looks”",
            meaning: "She tells him to smooth out his rough, worried face and to be ‘bright and jovial’ among the guests tonight.",
            effect: "This is the mask again. In Act 1 she taught him to ‘look like th’ innocent flower’. Even though she has just admitted she is unhappy, she still believes that the answer is to make the outside look right. Appearance is her way of managing reality.",
            ask: "Why is a smooth face so important to her?", tags: ["appearance", "lady", "peel"] },
          { id: "a3n22-9", from: 33, to: 39, title: "Faces like masks",
            meaning: "Macbeth agrees, and says they must honour Banquo with their eyes and tongues. ‘Vizards’ are masks. He says their faces must be masks over their hearts, hiding what they really are.",
            effect: "Macbeth now says the mask idea better than she did. In Act 1 Scene 7 he ended with ‘False face must hide what the false heart doth know’; now the false face is a ‘vizard’. And he plans to ‘present’ Banquo ‘eminence’ (honour him) while arranging Banquo’s death: dramatic irony, because the audience watched him hire the murderers. He has learned the lesson of appearance so well that he is teaching it.",
            ask: "Who is the better actor now, Macbeth or Lady Macbeth?", tags: ["appearance", "irony", "ambition", "language", "peel"] },
          { id: "a3n22-10", from: 40, to: 42, title: "Scorpions",
            meaning: "Lady Macbeth tells him to ‘leave this’ (stop brooding). He says his mind is ‘full of scorpions’, because Banquo and Fleance are still alive.",
            effect: "A scorpion is a small creature that stings. The image says his thoughts are crawling, poisonous things. His ambition has turned inward and become a torment. Notice ‘Thou know’st’: he assumes she shares his fear of Banquo, even though he has not told her his plan.",
            ask: "Why is a mind ‘full of scorpions’ stronger than a mind that is ‘worried’?", tags: ["ambition", "language", "guilt", "peel"] },
          { id: "a3n22-11", at: 43, phrase: "But in them nature’s copy’s not eterne.", title: "Banquo can die",
            meaning: "She says that nature’s ‘copy’ (the lease on life held by Banquo and Fleance) is ‘not eterne’: they will not live for ever.",
            effect: "Directors disagree here. Some have Lady Macbeth hint at murder; others have her only comforting him with the idea that everyone dies. Macbeth takes it as a hint: ‘There’s comfort yet; they are assailable.’",
            ask: "Is she suggesting murder, or only comforting him? Find a reason for each view.", tags: ["lady", "ambition", "ahead"] },
          { id: "a3n22-12", at: 50, phrase: "What’s to be done?", title: "Word to know: role reversal",
            meaning: "She asks ‘What’s to be done?’: what are you going to do?",
            effect: "In Act 1 she said ‘Leave all the rest to me’ and took charge of the murder. Now she has to ask what her husband is planning. When two characters swap the positions they held earlier, that is a role reversal: today’s word. He used to need her; now she needs to be told.",
            ask: "Find one thing Lady Macbeth controlled in Act 1 Scene 7 that Macbeth controls here.", tags: ["lady", "ambition", "ahead", "peel"] },
          { id: "a3n22-13", from: 51, to: 52, title: "Innocent of the knowledge",
            meaning: "‘Be innocent of the knowledge’: stay ignorant of the plan until it is finished, and then you can applaud it. ‘Chuck’ is a tender word, like ‘chick’.",
            effect: "A loving word covers a shutting-out: he calls her ‘dearest chuck’ while telling her she is not trusted with the truth. The word ‘innocent’ is ironic. In Act 1 she told him to look innocent while being guilty. Now he wants her to be innocent by knowing nothing. The kind surface hides a real distance.",
            ask: "How can one phrase be both affectionate and cold?", tags: ["appearance", "irony", "lady", "ambition", "peel"] },
          { id: "a3n22-14", from: 53, to: 57, title: "“Come, seeling night”",
            meaning: "He calls on night to blind the ‘tender eye of pitiful day’ and to cancel ‘that great bond’ that keeps him pale. ‘Seeling’ means sewing up the eyelids, as a hunter did to a hawk.",
            effect: "In Act 1 Scene 5 Lady Macbeth called on ‘thick night’ to hide her ‘keen knife’ from heaven. Macbeth now uses her kind of language: the same darkness, the same wish that nobody should see. He has taken over her voice. What the ‘bond’ is is not explained, which adds to the menace.",
            ask: "Which words here remind you of Lady Macbeth in Act 1 Scene 5?", tags: ["language", "ambition", "lady", "peel"] },
          { id: "a3n22-15", from: 61, to: 62, title: "“Things bad begun”",
            meaning: "He tells her to stay quiet: ‘Things bad begun make strong themselves by ill’. Wrong deeds can only be kept safe by doing more wrong.",
            effect: "This rhyming couplet is the scene’s verdict: ambition won by crime must be defended by more crime. In Act 1 Scene 7 Macbeth worried that bloody instructions ‘return / To plague th’ inventor’. He has stopped worrying about that.",
            ask: "Is Macbeth’s ambition now a wish, or a habit?", tags: ["ambition", "language", "ahead", "peel"] }
        ],
        gloss: [["content", "contentment, satisfaction"], ["sorriest fancies", "most miserable thoughts"], ["scorched", "wounded, slashed"], ["malice", "wickedness (here, their plan)"], ["ecstasy", "violent distress, frenzy"], ["vizards", "masks"], ["lave", "wash"], ["eterne", "eternal"], ["assailable", "able to be attacked"], ["jocund", "cheerful, merry"], ["chuck", "a term of affection, like ‘chick’"], ["seeling", "blinding (from sewing a hawk’s eyelids shut)"], ["rooky", "full of rooks (crows)"]] },
      { type: "extract", key: "a3e23", short: "3.4 Annotate", mins: 20, label: "Extract 23", title: "Act 3, Scene 4: the ghost and the guests", sub: "Appearance and reality at the feast", scene: "3.4",
        setup: "This is the longest and most dramatic scene of the act. Watch Lady Macbeth switch between speaking to the lords and speaking privately to her husband. Then watch what happens to both of them once the guests have gone. Skipped parts are shown in italics.",
        think: "With a partner (30 seconds): Lady Macbeth keeps up a perfect public face. Does she manage to keep control by the end of the scene?", thinkSecs: 30,
        task: "Underline one line where Lady Macbeth protects the appearance of the feast. Circle the line where Macbeth says he cannot turn back.",
        lines: [
          SP("Macbeth"), L(59, "Which of you have done this?"),
          SP("Lords"), L(60, "What, my good lord?"),
          SP("Macbeth, to the Ghost"), L(61, "Thou canst not say I did it. Never shake"), L(62, "Thy gory locks at me."),
          SP("Ross"), L(63, "Gentlemen, rise. His Highness is not well."),
          SP("Lady Macbeth"), L(64, "Sit, worthy friends. My lord is often thus"), L(65, "And hath been from his youth. Pray you, keep seat."), L(66, "The fit is momentary; upon a thought"), L(67, "He will again be well. If much you note him"), L(68, "You shall offend him and extend his passion."), L(69, "Feed and regard him not."),
          ST("She draws Macbeth aside.", "s69"),
          L(70, "Are you a man?"),
          SP("Macbeth"), L(71, "Ay, and a bold one, that dare look on that"), L(72, "Which might appall the devil."),
          SP("Lady Macbeth"), L(73, "O, proper stuff!"), L(74, "This is the very painting of your fear."), L(75, "This is the air-drawn dagger which you said"), L(76, "Led you to Duncan. O, these flaws and starts,"), L(77, "Impostors to true fear, would well become"), L(78, "A woman’s story at a winter’s fire,"), L(79, "Authorized by her grandam. Shame itself!"), L(80, "Why do you make such faces? When all’s done,"), L(81, "You look but on a stool."),
          SP("Macbeth"), L(82, "Prithee, see there. Behold, look! [To the Ghost.] Lo,"), L(83, "how say you?"),
          GAP("[…Macbeth challenges the Ghost, which then exits…]"),
          SP("Lady Macbeth"), L(88, "What, quite unmanned in folly?"),
          SP("Macbeth"), L(89, "If I stand here, I saw him."),
          SP("Lady Macbeth"), L(90, "Fie, for shame!"),
          GAP("[…Macbeth says that in the olden days murdered men stayed dead…]"),
          SP("Macbeth"), L(98, "And push us from our stools. This is more strange"), L(99, "Than such a murder is."),
          SP("Lady Macbeth"), L(100, "My worthy lord,"), L(101, "Your noble friends do lack you."),
          SP("Macbeth"), L(102, "I do forget.—"), L(103, "Do not muse at me, my most worthy friends."), L(104, "I have a strange infirmity, which is nothing"), L(105, "To those that know me. Come, love and health to"), L(106, "all."), L(107, "Then I’ll sit down.—Give me some wine. Fill full."),
          ST("Enter Ghost.", "s107"),
          L(108, "I drink to th’ general joy o’ th’ whole table"), L(109, "And to our dear friend Banquo, whom we miss."), L(110, "Would he were here! To all, and him we thirst,"), L(111, "And all to all."),
          GAP("[…Macbeth shouts at the Ghost again. Lady Macbeth tells the lords to think of it as a thing of custom, and Macbeth dares the ghost to take any shape but its own…]"),
          SP("Macbeth"), L(128, "The baby of a girl. Hence, horrible shadow!"), L(129, "Unreal mock’ry, hence! [Ghost exits.]"), L(130, "Why so, being gone,"), L(131, "I am a man again.—Pray you sit still."),
          SP("Lady Macbeth"), L(132, "You have displaced the mirth, broke the good"), L(133, "meeting"), L(134, "With most admired disorder."),
          SP("Macbeth"), L(135, "Can such things be"), L(136, "And overcome us like a summer’s cloud,"), L(137, "Without our special wonder? You make me strange"), L(138, "Even to the disposition that I owe"), L(139, "When now I think you can behold such sights"), L(140, "And keep the natural ruby of your cheeks"), L(141, "When mine is blanched with fear."),
          GAP("[…Ross asks ‘What sights, my lord?’…]"),
          SP("Lady Macbeth"), L(144, "I pray you, speak not. He grows worse and worse."), L(145, "Question enrages him. At once, good night."), L(146, "Stand not upon the order of your going,"), L(147, "But go at once."),
          GAP("[…Lennox says good night. Lady Macbeth says ‘A kind good night to all.’ The lords exit, leaving Macbeth and Lady Macbeth alone…]"),
          SP("Macbeth"), L(151, "It will have blood, they say; blood will have blood."),
          GAP("[…Macbeth asks if she knows that Macduff refused to come when summoned, and says he keeps a paid servant in every house…]"),
          SP("Macbeth"), L(165, "(And betimes I will) to the Weïrd Sisters."), L(166, "More shall they speak, for now I am bent to know"), L(167, "By the worst means the worst. For mine own good,"), L(168, "All causes shall give way. I am in blood"), L(169, "Stepped in so far that, should I wade no more,"), L(170, "Returning were as tedious as go o’er."), L(171, "Strange things I have in head that will to hand,"), L(172, "Which must be acted ere they may be scanned."),
          SP("Lady Macbeth"), L(173, "You lack the season of all natures, sleep."),
          SP("Macbeth"), L(174, "Come, we’ll to sleep. My strange and self-abuse"), L(175, "Is the initiate fear that wants hard use."), L(176, "We are yet but young in deed."),
          ST("They exit.", "s176")
        ],
        notes: [
          { id: "a3n23-1", from: 59, to: 62, title: "The mask slips",
            meaning: "Macbeth asks the lords ‘Which of you have done this?’ When they answer ‘What, my good lord?’, he speaks to the Ghost: ‘Thou canst not say I did it.’",
            effect: "In 3.1 he was calm and polite. Here the mask slips in public. The lords are puzzled because they can see nothing, so the audience hears Macbeth giving himself away. ‘Thou canst not say I did it’ is a denial of an accusation nobody has made. That is dramatic irony: we know what ‘this’ is; the lords do not.",
            ask: "What does the denial tell us about how Macbeth sees his own guilt?", tags: ["appearance", "irony", "guilt", "peel"] },
          { id: "a3n23-2", from: 64, to: 68, title: "Lady Macbeth takes control of the room",
            meaning: "Lady Macbeth tells the lords to sit: her lord ‘is often thus’, has been since youth, and the fit is ‘momentary’. If they look at him too much, they will make him worse.",
            effect: "She invents a past for him on the spot, using the polite phrase ‘worthy friends’. She does not just hide the truth: she controls where the lords look. This is the mask under pressure, and her best moment of control in the scene. Compare Act 2 Scene 2, where she took control by giving practical orders.",
            ask: "How does she keep the lords seated and quiet?", tags: ["lady", "appearance", "peel"] },
          { id: "a3n23-3", at: 70, phrase: "Are you a man?", title: "“Are you a man?”",
            meaning: "In private, she asks him whether he is a man.",
            effect: "She uses the same weapon as in Act 1 Scene 7, where she said ‘When you durst do it, then you were a man.’ Then it pushed him into murder; here it does not stop his terror. Notice the change from smooth hostess to harsh private voice in one line. The woman who asked to be ‘unsexed’ is again challenging his manhood.",
            ask: "Why does she go back to manhood as her argument? Why does it work less well this time?", tags: ["lady", "ambition", "appearance", "peel"] },
          { id: "a3n23-4", from: 71, to: 72, title: "“A bold one”",
            meaning: "He answers ‘Ay, and a bold one’: he claims to be brave because he dares to look at something that might frighten even the devil.",
            effect: "Macbeth’s idea of being a man has always been about daring (‘I dare do all that may become a man’ in Act 1). He still wants to be brave, but the thing he dares to look at is his own guilt. Courage and fear have become the same thing.",
            tags: ["ambition", "language", "guilt"] },
          { id: "a3n23-5", from: 73, to: 81, title: "“The very painting of your fear”",
            meaning: "She says that what he sees is only a ‘painting’, an ‘air-drawn dagger’, a thing for a ‘woman’s story at a winter’s fire’. ‘When all’s done, you look but on a stool.’",
            effect: "For Lady Macbeth the only reality is what everyone can see: a stool. For Macbeth the reality is the ghost, and in many productions the audience can see it too. This is appearance against reality at its sharpest. Notice the insult: she, who asked to be ‘unsexed’, calls his fear womanish. She also reuses the ‘painted devil’ idea from Act 2 Scene 2: she believes that fear is only a picture.",
            ask: "Who is right about what is real here, Macbeth or Lady Macbeth?", tags: ["lady", "appearance", "irony", "language", "peel"] },
          { id: "a3n23-6", from: 88, to: 90, title: "Unmanned in folly",
            meaning: "‘What, quite unmanned in folly?’ she asks after the Ghost leaves. He answers ‘If I stand here, I saw him.’ She says ‘Fie, for shame!’",
            effect: "Her sentences all shame him; his are short, stubborn statements of what he saw. Her power to calm him has limits: she can control the room, but she cannot control what he sees. In Act 2 she took the daggers away; here there is nothing she can take.",
            ask: "What can Lady Macbeth control in this scene, and what can she not?", tags: ["lady", "appearance", "ahead"] },
          { id: "a3n23-7", from: 98, to: 99, title: "Pushed from our stools",
            meaning: "He says murdered men used to stay dead. Now they ‘rise again… and push us from our stools’, which is stranger than the murder itself.",
            effect: "‘Stools’ picks up Lady Macbeth’s phrase that he ‘looks but on a stool’. A king can be pushed from his seat. His fear is not only the dead man but the loss of the throne: ambition has become the fear of being replaced.",
            ask: "Why might it frighten a king to be ‘pushed from a stool’?", tags: ["ambition", "language", "ahead", "irony"] },
          { id: "a3n23-8", from: 102, to: 107, title: "“A strange infirmity”",
            meaning: "Macbeth says he forgets himself, asks the lords not to ‘muse’ (wonder) at him, says he has a ‘strange infirmity’ that is nothing to those who know him, then calls for wine.",
            effect: "He has taken her cover story and now says it himself. In 3.2 he promised ‘make our faces vizards to our hearts’; here the mask is back on. But watch what he does next: he fills his cup and toasts Banquo.",
            ask: "How do Macbeth’s words here copy Lady Macbeth’s earlier lines?", tags: ["appearance", "irony", "lady", "peel"] },
          { id: "a3n23-9", from: 108, to: 111, title: "A toast to the man he killed",
            meaning: "He drinks to the joy of the whole table and to ‘our dear friend Banquo, whom we miss’. ‘Would he were here!’",
            effect: "He toasts a man he had murdered, and says he wishes him here, just after the Ghost has re-entered. In 3.2 he said ‘present him eminence’ (honour him): this is exactly that, taken too far. His own lie is turned back on him. A powerful example of dramatic irony and of appearance against reality.",
            ask: "Why is the toast the worst possible thing for Macbeth to say?", tags: ["irony", "appearance", "guilt", "peel"] },
          { id: "a3n23-10", from: 128, to: 131, title: "“I am a man again”",
            meaning: "‘The baby of a girl’ is the insult he would deserve if he trembled. When the Ghost leaves he says ‘Hence, horrible shadow! Unreal mock’ry, hence!’ and ‘Why so, being gone, I am a man again.’",
            effect: "His manhood depends on what is in front of him. Now he calls the ghost ‘unreal mock’ry’, which is almost Lady Macbeth’s opinion. This is a mock-brave ending to a scene of fear. The insult ‘baby of a girl’ repeats the manhood theme that Lady Macbeth used against him in Act 1.",
            ask: "Why does Macbeth need to say ‘I am a man again’ out loud?", tags: ["appearance", "language", "ambition"] },
          { id: "a3n23-11", from: 132, to: 141, title: "“You make me strange”",
            meaning: "She says he has spoiled the party ‘with most admired disorder’ (amazing disorder). He replies that she makes him a stranger to himself, because she can see such sights and still keep ‘the natural ruby of your cheeks’ while his are ‘blanched with fear’.",
            effect: "Macbeth thinks she is fearless: her cheeks stay red while his go white. He does not see that her calm is a performance. The mask is working perfectly, even on her husband. He is now an outsider in his own marriage.",
            ask: "Is Lady Macbeth really unafraid? What evidence is there in this scene and in 3.2?", tags: ["lady", "appearance", "irony", "peel"] },
          { id: "a3n23-12", from: 144, to: 147, title: "“The order of your going”",
            meaning: "She tells the lords not to wait for ceremony: ‘Question enrages him… go at once.’",
            effect: "This scene began with ceremony: ‘You know your own degrees; sit down.’ It ends with the lords being sent out in disorder. Her skilled control of appearances has run out; she can only end the party. The ‘order’ that Macbeth’s kingdom stands on has collapsed in one night.",
            ask: "Compare Macbeth’s first line in this scene with this one. What has happened to the feast?", tags: ["lady", "appearance", "ahead"] },
          { id: "a3n23-13", at: 151, phrase: "blood will have blood", title: "“Blood will have blood”",
            meaning: "Alone with her, Macbeth says it is said that ‘blood will have blood’: murder is revenged by more murder, or revealed.",
            effect: "Once the guests have gone, the mask comes off and he speaks truthfully about his fear of discovery. Blood is a repeated image in the play: it is in the dagger speech, on his hands, in the ghost’s ‘gory locks’. Follow its path through the rest of the play.",
            ask: "Where else in Acts 2 and 3 has blood appeared as an image?", tags: ["guilt", "language", "ahead", "peel"] },
          { id: "a3n23-14", from: 168, to: 172, title: "“In blood stepped in so far”",
            meaning: "He says he is ‘in blood stepped in so far’ that, if he stopped wading, going back would be as tiring as going on. He has ‘strange things in head’ that must be done before they can be examined. First, he will go to the witches ‘by the worst means’.",
            effect: "Ambition has become momentum. Macbeth is no longer choosing to go on; he feels that stopping is just as hard as continuing. In Act 1 Scene 7 he spent a long speech weighing consequences; now he acts first and ‘scans’ later. The man who once hoped chance would crown him now goes looking for fate by the worst means. Compare the dagger speech: ‘Words to the heat of deeds too cold breath gives.’",
            ask: "Is Macbeth still choosing here, or has the choice already been taken from him?", tags: ["ambition", "language", "ahead", "peel"] },
          { id: "a3n23-15", at: 173, phrase: "You lack the season of all natures, sleep.", title: "Her reply is a remedy",
            meaning: "She says he is missing ‘the season of all natures’: sleep.",
            effect: "The planner of Act 1 now answers with a simple remedy for tiredness. She cannot ask about his plans, as she did in 3.2, or argue with him; she can only suggest rest. Remember that sleep is lost for both of them: ‘Macbeth shall sleep no more’, and she will walk in her sleep in Act 5.",
            ask: "What does this line suggest about how much power she has left?", tags: ["lady", "guilt", "ahead", "peel"] },
          { id: "a3n23-16", from: 174, to: 176, title: "“We are yet but young in deed”",
            meaning: "He says his ‘strange and self-abuse’ (strange self-deception) is the beginner’s fear that needs ‘hard use’ (practice). ‘We are yet but young in deed.’",
            effect: "He thinks the cure for fear is more crime. ‘Young in deed’ means he sees himself as a beginner; the audience sees a man who is already in too deep. The scene ends on a rhyming couplet that sounds like a decision. Notice who decides: Macbeth speaks and she follows.",
            ask: "How does this last line sum up how Macbeth’s ambition has changed since Act 2?", tags: ["ambition", "language", "ahead", "peel"] }
        ],
        gloss: [["muse", "wonder, be amazed"], ["infirmity", "weakness, illness"], ["flaws and starts", "sudden outbursts and fits"], ["authorized", "vouched for"], ["grandam", "grandmother"], ["unmanned", "robbed of manly courage"], ["admired", "amazing, astonishing"], ["blanched", "turned white"], ["disposition that I owe", "the nature that I own"], ["betimes", "early, in good time"], ["scanned", "closely examined"], ["initiate fear", "the fear of a beginner"]] },
      { type: "plenary", key: "a3h4-end", short: "Exit", mins: 10, title: "Exit ticket",
        ticket: [
          { q: "Find a quotation where Lady Macbeth admits she is not happy.", a: "For example “Naught’s had, all’s spent, / Where our desire is got without content,” or “’Tis safer to be that which we destroy / Than by destruction dwell in doubtful joy.”" },
          { q: "Explain what “role reversal” means, and show it using “What’s to be done?”", a: "A role reversal is when two characters swap the positions they held earlier. In Act 1 Lady Macbeth planned and Macbeth was unsure. Here she has to ask what is happening (“What’s to be done?”) and Macbeth keeps her out: “Be innocent of the knowledge.”" },
          { q: "Appearance vs reality: pick one quotation about masks or looking a certain way, and explain what it shows.", a: "For example “make our faces vizards to our hearts, / Disguising what they are”: masks hide what they really feel. Or “Sleek o’er your rugged looks. Be bright and jovial”: Lady Macbeth tells him to hide his worry behind a cheerful face." },
          { q: "Find a quotation that shows Lady Macbeth protecting appearances in front of the lords.", a: "For example “Sit, worthy friends. My lord is often thus / And hath been from his youth,” or “Feed and regard him not.”" },
          { q: "Ambition tracker: how has Macbeth changed between the dagger speech (Act 2) and “I am in blood / Stepped in so far” (Act 3)?", a: "In Act 2 he argues with himself and is held back by fear before acting. In Act 3 he acts first and examines later (“acted ere they may be scanned”), because turning back seems as hard as going on. His ambition no longer needs persuading." },
          { q: "Compare Lady Macbeth in Act 2 Scene 2 (“Give me the daggers”) with Lady Macbeth in Act 3. What has changed, and what has stayed the same?", a: "The same: she still manages appearances and shames Macbeth’s fear (“Infirm of purpose!” / “Are you a man?”). Changed: in Act 2 she controlled events and he followed. In Act 3 she cannot control what he sees, has to ask what is happening (3.2), and ends the feast in disorder. She now reacts rather than leads." } ],
        next: "Next: Act 4, where Macbeth goes back to the witches, just as Hecate planned." }
    ],
    aims: {
      li: "To analyse how Shakespeare shows Macbeth and Lady Macbeth changing in Act 3, using close reading of language to explore ambition and appearance against reality.",
      sc: ["I can explain what role reversal means.", "I can find a quotation that shows Lady Macbeth is unhappy even though she has what she wanted.", "I can find a quotation where Lady Macbeth protects the appearance of the feast.", "I can explain what “I am in blood / Stepped in so far” shows about Macbeth’s ambition."],
      stretch: "I can compare how Macbeth and Lady Macbeth have each changed since Act 2, using two quotations from today’s extracts.",
      word: { w: "role reversal", m: "when two characters swap the positions they held earlier in the story.", eg: "In Act 1 Lady Macbeth planned the murder and Macbeth hesitated; in Scene 3.2 Macbeth plans and she has to ask what is being done. Use the term in one sentence today." },
      bridge: "Over three lessons we have read the whole of Act 3. Today we go back to two scenes where Macbeth and Lady Macbeth are on stage together, and annotate them closely."
    }
  }
  ]
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<i class="sd">[$1]</i>');
const SHORT = { ambition: "Ambition", language: "Language", appearance: "Appearance", ahead: "Look ahead", guilt: "Guilt", lady: "Lady Macbeth", peel: "★ PEEL evidence", irony: "Irony" };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ratings are the only thing kept on the device, and only if the browser allows it */
const RKEY = "macbeth-act3-ratings";
function loadRate() { try { return JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) { return {}; } }
function saveRate() { try { localStorage.setItem(RKEY, JSON.stringify(S.rate)); } catch (e) { /* storage unavailable */ } }

/* S.drawer: which side panel is open (null = closed). S.wide / S.mainHidden: how the two panes share the screen. S.focus: extract-only mode. */
const S = { view: "lesson", h: 0, s: 0, tag: "all", sel: null, scale: 1, drawer: null, wide: false, mainHidden: false, focus: false, rate: loadRate() };
const cur = () => DATA.hours[S.h].steps[S.s];
let DR = {}; /* drawers of the step on screen */

/* order notes by position in the text */
DATA.hours.forEach((h) => h.steps.forEach((st) => {
  if (st.type !== "extract") return;
  if (!st.notes) st.notes = [];
  const posOf = (n) => {
    let i;
    if (n.stage) i = st.lines.findIndex((l) => l.k === "st" && l.key === n.stage);
    else { const ln = n.at !== undefined ? n.at : n.from; i = st.lines.findIndex((l) => l.k === "ln" && l.n === ln); }
    return i * 1000 + (n.phrase && !n.stage ? Math.max(0, (st.lines[i].t || "").indexOf(n.phrase)) : 0);
  };
  st.notes.forEach((n) => (n._pos = posOf(n)));
  st.notes.sort((a, b) => a._pos - b._pos);
}));

const tagOK = (n, tag) => tag === "all" || n.tags.includes(tag);
const match = (n) => tagOK(n, S.tag);
const visible = (st) => st.notes.filter(match);
const byId = (st, id) => st.notes.find((n) => n.id === id);

/* ---------- top bar: lessons menu + navigation ---------- */
function renderTop() {
  $("#lbl").textContent = DATA.hours[S.h].title;
  $("#lmenu").innerHTML = DATA.hours.map((h, i) =>
    `<button class="lm${i === S.h ? " on" : ""}" data-h="${i}"><b>${esc(h.title)}</b><small>${esc(h.subtitle)}</small></button>`).join("");
}
function renderNav() {
  const nav = $("#nav");
  const h = DATA.hours[S.h], n = h.steps.length;
  const first = S.h === 0 && S.s === 0;
  const lastStep = S.s === n - 1, lastAll = S.h === DATA.hours.length - 1 && lastStep;
  const nextLabel = !lastStep ? `Next: ${esc(h.steps[S.s + 1].short)}` : lastAll ? "Finished" : "Next lesson";
  nav.innerHTML =
    `<button class="btn back" data-act="prev" ${first ? "disabled" : ""} aria-label="${S.s === 0 && !first ? "Last lesson" : "Back"}"><i class="ic ic-back"></i><span class="tx">${S.s === 0 && !first ? "Last lesson" : "Back"}</span></button>` +
    `<ol class="steps">` + h.steps.map((s, i) =>
      `<li class="${i < S.s ? "done" : ""}"><button class="stp ${s.type}${i === S.s ? " on" : ""}${i < S.s ? " done" : ""}" data-s="${i}" title="${esc(s.short)} · about ${s.mins} min" ${i === S.s ? 'aria-current="step"' : ""}><span class="pn">${i + 1}</span><span class="pl">${esc(s.short)}</span></button></li>`).join("") + `</ol>` +
    `<button class="btn primary next" data-act="next" ${lastAll ? "disabled" : ""}><span class="tx">${nextLabel}</span><i class="ic ic-next"></i></button>`;
}

/* ---------- bottom bar: theme filters (notes) ---------- */
function chipRow(notes, active) {
  const counts = {};
  notes.forEach((n) => n.tags.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  return `<span class="fl">Show notes about</span><button class="chip${active === "all" ? " on" : ""}" data-tag="all">All (${notes.length})</button>` +
    Object.keys(DATA.TAGS).filter((t) => counts[t]).map((t) =>
      `<button class="chip tg-${t}${active === t ? " on" : ""}" data-tag="${t}"><i class="dot"></i>${esc(SHORT[t])} (${counts[t]})</button>`).join("");
}
function renderFilters() {
  const el = $("#filters");
  const st = cur();
  if (st.type !== "extract" || !st.notes.length) { el.hidden = true; return; }
  el.hidden = false;
  const has = new Set(); st.notes.forEach((n) => n.tags.forEach((t) => has.add(t)));
  if (S.tag !== "all" && !has.has(S.tag)) S.tag = "all";
  el.innerHTML = chipRow(st.notes, S.tag);
}

/* ---------- shared pieces ---------- */
function qaCards(qa) {
  return qa.map((q) => `<div class="qa ${q.lvl || ""}" role="button" tabindex="0" data-qa>${q.lvl ? `<span class="lv">${q.lvl === "core" ? "Core" : "Stretch"}</span>` : ""}<div class="qq">${esc(q.q)}</div><div class="aa">${esc(q.a)}</div></div>`).join("");
}
function ratingHTML(h) {
  const A = DATA.hours[h].aims;
  const items = A.stretch ? [...A.sc, A.stretch] : [...A.sc];
  return items.map((t, i) => {
    const v = S.rate[h + ":" + i];
    return `<div class="rate"><p>${A.stretch && i === A.sc.length ? "<b>Stretch:</b> " : ""}${esc(t)}</p><div class="rbtns">` +
      ["Not yet", "Nearly", "Got it"].map((l, k) => `<button class="rb${v === k ? " on" : ""}" data-rate="${h}:${i}:${k}">${l}</button>`).join("") + `</div></div>`;
  }).join("");
}
function clozeParts(text) {
  let i = 0;
  const html = esc(text).replace(/\{\{(.+?)\}\}/g, (m, a) => { i++; return `<span class="gap" data-gap role="button" tabindex="0"><sup>${i}</sup><span class="ans">${esc(a)}</span></span>`; });
  const bank = [...text.matchAll(/\{\{(.+?)\}\}/g)].map((m) => m[1]).sort((a, b) => a.localeCompare(b));
  return { html, bank };
}
function hingeHTML(hg) {
  return `<div class="hinge"><div class="lab">Quick check: vote, then reveal</div><p class="hq">${esc(hg.q)}</p>` +
    hg.opts.map((o, i) => `<button class="opt" data-hinge="${i}">${"ABCD"[i]}&nbsp; ${esc(o)}</button>`).join("") +
    `<div class="row"><button class="ghost small" data-act="hingeshow">Show answer</button></div><div class="hres" hidden></div></div>`;
}
const ideas = (items) => items.map((i) => `<div class="idea"><b>${esc(i.h)}</b><p>${esc(i.t)}</p></div>`).join("");

/* ---------- the extract ---------- */
function annSpans(text, notes) {
  const marks = [];
  notes.forEach((n) => { const i = text.indexOf(n.phrase); if (i >= 0) marks.push({ s: i, e: i + n.phrase.length, n }); });
  marks.sort((a, b) => a.s - b.s);
  let out = "", p = 0;
  marks.forEach((m) => {
    out += fmt(text.slice(p, m.s));
    out += `<span class="ann${match(m.n) ? "" : " dim"}" data-note="${m.n.id}" role="button" tabindex="0">${fmt(text.slice(m.s, m.e))}</span>`;
    p = m.e;
  });
  return out + fmt(text.slice(p));
}
function quoteOf(st, n) {
  if (n.phrase) return n.phrase;
  const ls = st.lines.filter((l) => l.k === "ln" && l.n >= n.from && l.n <= n.to).map((l) => l.t);
  return ls.length > 2 ? ls[0] + " … " + ls[ls.length - 1] : ls.join(" / ");
}
function notePanel(st, n) {
  const vis = visible(st), idx = vis.findIndex((x) => x.id === n.id);
  const tiers = (n.support || n.stretch)
    ? `<div class="tierbtns">${n.support ? `<button class="ghost small" data-act="tog" data-t="sup">Need a starter?</button>` : ""}${n.stretch ? `<button class="ghost small" data-act="tog" data-t="str">Push further</button>` : ""}</div>` +
      (n.support ? `<div class="tier sup" hidden><b>Sentence starter</b>${esc(n.support)}</div>` : "") +
      (n.stretch ? `<div class="tier str" hidden><b>Stretch question</b>${esc(n.stretch)}</div>` : "")
    : "";
  return `<div class="ptop"><span>Note ${idx + 1} of ${vis.length}</span></div>` +
    `<p class="q">${fmt(quoteOf(st, n))}</p><h3>${esc(n.title)}</h3>` +
    `<div class="lab">In plain English</div><p>${esc(n.meaning)}</p>` +
    `<div class="lab">Why it matters</div><p>${esc(n.effect)}</p>` +
    (n.ask ? `<div class="ask"><b>Ask the class</b><p>${esc(n.ask)}</p></div>` : "") + tiers +
    `<div class="tagrow">${n.tags.map((t) => `<span class="chip tg-${t}"><i class="dot"></i>${esc(DATA.TAGS[t])}</span>`).join("")}</div>` +
    `<div class="notenav"><button data-act="pn">◀ Previous note</button><button data-act="nn">Next note ▶</button></div>`;
}
function scenePanel(st) {
  return `<p class="lead">${esc(st.setup)}</p>` +
    (st.think ? `<div class="think"><b>Think first</b><p>${esc(st.think)}</p><button class="ghost small" data-act="timer" data-sec="${st.thinkSecs || 30}">Start timer</button></div>` : "") +
    (st.task ? `<div class="think"><b>Your task</b><p>${esc(st.task)}</p></div>` : "") +
    (st.read ? "" : `<button class="ghost" data-act="firstnote">Open the first note</button>`);
}
function glossPanel(st) {
  return `<p class="hint">Words you may not know.</p>` + st.gloss.map((g) => `<div class="idea"><b>${esc(g[0])}</b><p>${esc(g[1])}</p></div>`).join("");
}

/* ---------- what each step shows: one main focus, the rest in drawers ---------- */
const VIEW = {
  aims(st) {
    const A = DATA.hours[S.h].aims;
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: A.bridge || "", rail: "Aims",
      body: `<div class="inner aimsbody"><div class="li"><div class="lab">Learning intention</div><p>${esc(A.li)}</p></div>` +
        `<div class="sc"><div class="lab">Success criteria: by the end of the lesson I can…</div><ul>${A.sc.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${A.stretch ? `<p class="stretchsc"><b>Stretch:</b> ${esc(A.stretch)}</p>` : ""}</div></div>`,
      drawers: [
        { id: "donow", label: "Do now", cta: true, title: st.doNow.title, html: () => `<p class="hint">Talk in pairs first. Tap a question to check.</p>${qaCards(st.doNow.qa)}<div class="row"><button class="ghost" data-act="timer" data-sec="60">Start a 1-minute timer</button></div>` },
        { id: "word", label: "Word of the lesson", title: "Word of the lesson", html: () => `<div class="word"><b>${esc(A.word.w)}</b> means ${esc(A.word.m)} ${esc(A.word.eg)}</div>` },
      ],
    };
  },
  extract(st) {
    const phr = {}, rng = {}, stg = {};
    st.notes.forEach((n) => {
      if (n.phrase) { if (n.stage) (stg[n.stage] = stg[n.stage] || []).push(n); else (phr[n.at] = phr[n.at] || []).push(n); }
      else for (let i = n.from; i <= n.to; i++) rng[i] = n;
    });
    const body = st.lines.map((l) => {
      if (l.k === "sp") return `<div class="sp">${esc(l.t)}</div>`;
      if (l.k === "gap") return `<div class="gapline">${fmt(l.t)}</div>`;
      if (l.k === "st") return `<div class="stg">${l.key && stg[l.key] ? annSpans(l.t, stg[l.key]) : fmt(l.t)}</div>`;
      const r = rng[l.n];
      const num = l.n % 5 === 0 ? l.n : "";
      if (r) return `<div class="ln rng${match(r) ? "" : " dim"}" data-note="${r.id}" role="button" tabindex="0"><span class="num">${num}</span><span class="tx">${fmt(l.t)}</span></div>`;
      return `<div class="ln"><span class="num">${num}</span><span class="tx">${annSpans(l.t, phr[l.n] || [])}</span></div>`;
    }).join("");
    const drawers = [{ id: "scene", label: "Before you read", title: "Before you read", cta: !!st.think, html: () => scenePanel(st) }];
    if (st.gloss && st.gloss.length) drawers.push({ id: "gloss", label: "Hard words", title: "Hard words", html: () => glossPanel(st) });
    if (!st.read) drawers.push({ id: "note", label: () => `Notes (${visible(st).length})` });
    const foot = st.read
      ? `Reading extract: read it aloud and complete the task. It is not one of the two annotated extracts. Text: Folger Shakespeare Library edition (folger.edu). Line numbers as printed there.`
      : `Tap an underlined phrase or highlighted line to open its note. Text: Folger Shakespeare Library edition (folger.edu). Line numbers as printed there.`;
    return {
      kick: `${st.label} · ${st.read ? "read" : "annotate"} · about ${st.mins} min`, title: st.title, sub: st.sub, rail: "Extract", focus: true,
      body: `<div class="lines">${body}</div><div class="foot">${foot}</div>`,
      drawers,
    };
  },
  link(st) {
    const { html, bank } = clozeParts(st.text);
    const drawers = [];
    if (st.hinge) drawers.push({ id: "hinge", label: "Quick check", cta: true, title: "Quick check", html: () => hingeHTML(st.hinge) });
    if (st.ext) drawers.push({ id: "ext", label: "Stretch", title: "Stretch", html: () => `<p class="stretchsc"><b>Stretch:</b> ${esc(st.ext)}</p>` });
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Read aloud and tap each gap to reveal the word.", rail: "Gap-fill",
      actions: `<button class="tb" data-act="reveal">Reveal all</button>`,
      body: `<div class="inner"><div class="lab">Word bank</div><div class="bank">${bank.map((a) => `<span>${esc(a)}</span>`).join("")}</div><p class="cloze">${html}</p></div>`,
      drawers,
    };
  },
  plenary(st) {
    return {
      kick: `About ${st.mins} min`, title: st.title, sub: "Answer on your handout first. Then tap a question to check.", rail: "Exit ticket",
      body: `<div class="inner">${qaCards(st.ticket)}</div>`,
      drawers: [
        { id: "rate", label: "Rate yourself", cta: true, title: "Rate yourself", html: () => `<p class="hint">How well can you do each of today’s success criteria?</p><div id="ratings">${ratingHTML(S.h)}</div>` },
        { id: "next", label: "What’s next", title: "What’s next", html: () => `<div class="track"><p>${esc(st.next)}</p></div>` },
      ],
    };
  },
};

/* ---------- putting a step on screen ---------- */
function mainMarkup(v) {
  const btns = v.drawers.map((d) => `<button class="tb${d.cta ? " cta" : ""}" data-drawer="${d.id}" aria-pressed="false">${esc(typeof d.label === "function" ? d.label() : d.label)}</button>`).join("");
  const focus = v.focus ? `<button class="tb" data-act="focus" title="Show only the extract (F)"><i class="ic ic-focus"></i>Focus</button>` : "";
  return `<section class="pane main" id="mainpane"><div class="phead"><div class="pt"><span class="kick">${esc(v.kick)}</span><h2>${esc(v.title)}</h2>${v.sub ? `<p class="sub">${esc(v.sub)}</p>` : ""}</div>` +
    `<div class="ptools">${btns}${v.actions || ""}${focus}</div></div><div class="pbody" id="script">${v.body}</div></section>`;
}
const drawerMarkup = () =>
  `<aside class="pane drawer" id="drawer" hidden aria-label="Side panel"><div class="dhead"><h3 id="dtitle"></h3><div class="dtools">` +
  `<button class="tb" data-act="dwide" title="Make this panel wider or narrower"><i class="ic ic-wide"></i><span id="lw">Wider</span></button>` +
  `<button class="tb" data-act="dfull" title="Hide the main pane to use the full width"><i class="ic ic-full"></i><span id="lf">Hide</span></button>` +
  `<button class="ib" data-act="dclose" aria-label="Close" title="Close (Esc)"><i class="ic ic-close"></i></button></div></div><div class="dbody" id="panel" aria-live="polite"></div></aside>` +
  `<button class="railtab" id="mainrail" data-act="showmain" hidden></button>`;

function mount(keep) {
  const el = $("#stage");
  const st = cur();
  const v = VIEW[st.type](st);
  DR = {}; v.drawers.forEach((d) => (DR[d.id] = d));
  const keepTop = keep && $("#script") ? $("#script").scrollTop : 0;
  if (!keep) { S.drawer = null; S.wide = false; S.mainHidden = false; S.sel = null; }
  el.innerHTML = mainMarkup(v) + drawerMarkup();
  S.rail = (v.rail || "main pane").toLowerCase();
  const rail = $("#mainrail"); if (rail) rail.textContent = "Show " + S.rail;
  if (S.drawer && S.drawer !== "note" && !DR[S.drawer]) S.drawer = null;
  if (S.drawer === "note" && !S.sel) S.drawer = null;
  layout();
  if (S.sel) markSel();
  const sc = $("#script"); if (sc) sc.scrollTop = keepTop;
}
function markSel() { document.querySelectorAll("[data-note]").forEach((el) => el.classList.toggle("on", el.dataset.note === S.sel)); }
function layout() {
  const c = $("#stage"), d = $("#drawer");
  const has = !!S.drawer && !!d;
  c.classList.toggle("has-drawer", has);
  c.classList.toggle("wide", has && S.wide);
  c.classList.toggle("mainhidden", has && S.mainHidden);
  if (d) d.hidden = !has;
  const rail = $("#mainrail"); if (rail) rail.hidden = !(has && S.mainHidden);
  document.querySelectorAll(".tb[data-drawer]").forEach((b) => { const on = b.dataset.drawer === S.drawer; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
  if (has) { fillDrawer(); $("#lw").textContent = S.wide ? "Narrower" : "Wider"; $("#lf").textContent = (S.mainHidden ? "Show " : "Hide ") + S.rail; }
}
function fillDrawer() {
  const st = cur();
  let title, html;
  if (S.drawer === "note") {
    const n = S.sel && byId(st, S.sel);
    if (!n) { closeDrawer(); return; }
    title = "Notes"; html = notePanel(st, n);
  } else { const dd = DR[S.drawer]; title = dd.title || (typeof dd.label === "string" ? dd.label : ""); html = dd.html(); }
  $("#dtitle").textContent = title;
  $("#panel").innerHTML = html;
  $("#panel").scrollTop = 0;
}
function openDrawer(id) { S.drawer = id; layout(); }
function closeDrawer() {
  if (S.drawer === "note") S.sel = null;
  S.drawer = null; S.wide = false; S.mainHidden = false; markSel(); layout();
}
function select(id) {
  S.sel = id; S.drawer = "note"; markSel(); layout();
  const first = document.querySelector(`[data-note="${id}"]`);
  if (first) setTimeout(() => first.scrollIntoView({ block: "center", behavior: reduced() ? "auto" : "smooth" }), 40);
}
function stepNote(d) {
  const st = cur(), vis = visible(st);
  if (!vis.length) return;
  let i = vis.findIndex((n) => n.id === S.sel);
  i = i < 0 ? (d > 0 ? 0 : vis.length - 1) : (i + d + vis.length) % vis.length;
  select(vis[i].id);
}
function setFocus(on) {
  if (on && cur().type !== "extract") return;
  S.focus = on;
  document.body.classList.toggle("focus", on);
  $("#fctl").setAttribute("aria-hidden", String(!on));
  if (on) setTimeout(() => $("#unfocus").focus({ preventScroll: true }), 400);
  const sc = $("#script"); if (sc && on) sc.scrollTop = sc.scrollTop;
}

/* ---------- navigation ---------- */
function renderAll() { renderTop(); renderNav(); renderFilters(); mount(false); }
function go(h, s) {
  if (S.focus) setFocus(false);
  S.h = h; S.s = s; S.sel = null;
  renderAll();
}
function move(d) {
  let h = S.h, s = S.s + d;
  if (s < 0) { if (h === 0) return; h--; s = DATA.hours[h].steps.length - 1; }
  else if (s >= DATA.hours[h].steps.length) { if (h === DATA.hours.length - 1) return; h++; s = 0; }
  go(h, s);
}

/* ---------- timer ---------- */
const T = { id: null, end: 0 };
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function timerStart(sec) {
  clearInterval(T.id);
  const el = $("#timer"); el.hidden = false; el.classList.remove("done");
  T.end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
    $("#tt").textContent = left > 0 ? mmss(left) : "Time!";
    if (left <= 0) { clearInterval(T.id); el.classList.add("done"); }
  };
  tick(); T.id = setInterval(tick, 250);
}
function timerStop() { clearInterval(T.id); $("#timer").hidden = true; }

/* ---------- events ---------- */
function syncReveal(scope) {
  const btn = (scope || document).querySelector('[data-act="reveal"]');
  if (!btn) return;
  const gaps = [...(scope || document).querySelectorAll(".gap")];
  btn.textContent = gaps.length && gaps.every((g) => g.classList.contains("open")) ? "Hide all" : "Reveal all";
}
function hingeMark(box, hg, picked) {
  box.querySelectorAll(".opt").forEach((o, j) => { o.classList.toggle("right", j === hg.correct); o.classList.toggle("wrong", picked !== null && j === picked && j !== hg.correct); });
  const res = box.querySelector(".hres"); res.hidden = false;
  res.innerHTML = `<b>${picked === null ? "Answer:" : picked === hg.correct ? "Correct." : "Not quite."}</b> ${esc(hg.why)}`;
}
function hidePops() {
  document.querySelectorAll(".pop").forEach((p) => { p.hidden = true; const b = p.parentElement.querySelector("button[aria-haspopup]"); if (b) b.setAttribute("aria-expanded", "false"); });
}
document.addEventListener("click", (e) => {
  const t = e.target;
  const pb = t.closest("button[aria-haspopup]");
  if (pb) {
    const p = pb.parentElement.querySelector(".pop"), wasHidden = p.hidden;
    hidePops(); p.hidden = !wasHidden; pb.setAttribute("aria-expanded", String(wasHidden));
    return;
  }
  if (!t.closest(".pop")) hidePops();
  const dr = t.closest("[data-drawer]");
  if (dr) {
    const id = dr.dataset.drawer;
    if (S.drawer === id) closeDrawer();
    else if (id === "note") { if (S.sel && visible(cur()).some((n) => n.id === S.sel)) select(S.sel); else stepNote(1); }
    else { if (S.drawer === "note") S.sel = null; markSel(); openDrawer(id); }
    return;
  }
  const note = t.closest("[data-note]");
  if (note) { select(note.dataset.note); return; }
  const gap = t.closest("[data-gap]");
  if (gap) { gap.classList.toggle("open"); syncReveal(document); return; }
  const qa = t.closest("[data-qa]");
  if (qa) { qa.classList.toggle("open"); return; }
  const hb = t.closest("[data-hinge]");
  if (hb) { hingeMark(hb.closest(".hinge"), cur().hinge, +hb.dataset.hinge); return; }
  const rate = t.closest("[data-rate]");
  if (rate) {
    const [h, i, v] = rate.dataset.rate.split(":");
    S.rate[h + ":" + i] = +v; saveRate();
    const box = rate.closest("#ratings");
    if (box) box.innerHTML = ratingHTML(+h);
    return;
  }
  const b = t.closest("button");
  if (!b) return;
  if (b.closest("#tmenu")) { timerStart(+b.dataset.sec); hidePops(); return; }
  if (b.dataset.h !== undefined) { hidePops(); return go(+b.dataset.h, 0); }
  if (b.dataset.s !== undefined) return go(S.h, +b.dataset.s);
  if (b.dataset.tag !== undefined) {
    S.tag = b.dataset.tag;
    const st = cur();
    if (S.sel && !match(byId(st, S.sel))) { S.sel = null; if (S.drawer === "note") S.drawer = null; }
    renderFilters(); mount(true);
    return;
  }
  switch (b.dataset.act) {
    case "next": move(1); break;
    case "prev": move(-1); break;
    case "nn": stepNote(1); break;
    case "pn": stepNote(-1); break;
    case "firstnote": stepNote(1); break;
    case "dclose": closeDrawer(); break;
    case "dwide": S.wide = !S.wide; S.mainHidden = false; layout(); break;
    case "dfull": S.mainHidden = !S.mainHidden; layout(); break;
    case "showmain": S.mainHidden = false; layout(); break;
    case "focus": setFocus(true); break;
    case "unfocus": setFocus(false); break;
    case "tog": { const el = $("#panel ." + b.dataset.t); if (el) { el.hidden = !el.hidden; if (!el.hidden) el.scrollIntoView({ block: "nearest" }); } break; }
    case "timer": timerStart(+b.dataset.sec); break;
    case "tstop": timerStop(); break;
    case "hingeshow": hingeMark(b.closest(".hinge"), cur().hinge, null); break;
    case "reveal": {
      const gaps = document.querySelectorAll(".gap");
      const allOpen = [...gaps].every((g) => g.classList.contains("open"));
      gaps.forEach((g) => g.classList.toggle("open", !allOpen));
      syncReveal(document);
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  const tg = e.target instanceof Element ? e.target : document.body;
  if ((e.key === "Enter" || e.key === " ") && tg.matches("[role=button]")) { e.preventDefault(); tg.click(); return; }
  if (tg.matches("input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape") {
    if ([...document.querySelectorAll(".pop")].some((p) => !p.hidden)) hidePops();
    else if (S.focus) setFocus(false);
    else if (S.drawer) closeDrawer();
    return;
  }
  if (e.key === "f" || e.key === "F") { setFocus(!S.focus); return; }
  if (S.focus) return;
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "]") stepNote(1);
  else if (e.key === "[") stepNote(-1);
});

/* tools */
function setScale(d) {
  S.scale = Math.min(1.6, Math.max(0.75, +(S.scale + d).toFixed(2)));
  document.documentElement.style.setProperty("--scale", S.scale);
}
["#fsm", "#ffm"].forEach((id) => $(id).addEventListener("click", () => setScale(-0.1)));
["#fsp", "#ffp"].forEach((id) => $(id).addEventListener("click", () => setScale(0.1)));
function effectiveTheme() { return document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function syncTheme() { $("#theme").textContent = effectiveTheme() === "dark" ? "Day mode" : "Night mode"; }
$("#theme").addEventListener("click", () => { document.documentElement.dataset.theme = effectiveTheme() === "dark" ? "light" : "dark"; syncTheme(); });
$("#full").addEventListener("click", () => {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) { /* not available */ }
});
syncTheme();
renderAll();
</script>
</body>
